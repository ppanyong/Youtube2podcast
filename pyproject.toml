[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube2podcast"
version = "0.1.0"
description = "把带英文字幕的 YouTube 长视频转成可收听的中文学习音频"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "yt-dlp>=2024.12.23",
  "openai>=1.50",
  "mutagen>=1.47",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
youtube2podcast = "youtube2podcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
youtube2podcast = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
